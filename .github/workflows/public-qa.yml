name: Data-free repository QA

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  public-qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.2"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Verify canonical hashes
        shell: Rscript {0}
        run: source("scripts/verify_canonical_hashes.R")

      - name: Parse tracked R code
        shell: Rscript {0}
        run: |
          files <- system2("git", c("ls-files", "--", "*.R"), stdout = TRUE)
          stopifnot(length(files) > 0L, all(file.exists(files)))
          invisible(lapply(files, parse))
          cat(length(files), "R files parsed\n")

      - name: Rebuild submission manifest
        shell: Rscript {0}
        run: source("scripts/build_public_manifest.R")

      - name: Test Scientific Reports public metadata
        shell: Rscript {0}
        run: testthat::test_file("tests/testthat/test-public-release-metadata.R", stop_on_failure = TRUE)

      - name: Test Scientific Reports final release
        shell: Rscript {0}
        run: testthat::test_file("tests/testthat/test-scientific-reports-final-release.R", stop_on_failure = TRUE)

      - name: Test Scientific Reports package
        shell: Rscript {0}
        run: testthat::test_file("tests/testthat/test-scientific-reports-package.R", stop_on_failure = TRUE)

      - name: Test Scientific Reports release metadata
        shell: Rscript {0}
        run: testthat::test_file("tests/testthat/test-scientific-reports-release-metadata.R", stop_on_failure = TRUE)

      - name: Run repository tests by file
        shell: Rscript {0}
        run: |
          files <- sort(system2(
            "git",
            c("ls-files", "--", "tests/testthat/test*.R"),
            stdout = TRUE
          ))
          stopifnot(length(files) > 0L, all(file.exists(files)))
          rows <- lapply(files, function(file) {
            failure <- NULL
            tryCatch(
              testthat::test_file(file, stop_on_failure = TRUE),
              error = function(e) failure <<- conditionMessage(e)
            )
            data.frame(
              file = gsub("\\\\", "/", file),
              status = if (is.null(failure)) "PASS" else "FAIL",
              message = if (is.null(failure)) "" else failure,
              stringsAsFactors = FALSE
            )
          })
          results <- do.call(rbind, rows)
          write.table(
            results,
            "test-file-results.tsv",
            sep = "\t",
            row.names = FALSE,
            quote = FALSE,
            na = ""
          )
          print(results)
          if (any(results$status == "FAIL")) {
            stop("One or more repository test files failed; see test-file-results.tsv")
          }

      - name: Upload per-file test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-file-results
          path: test-file-results.tsv
          if-no-files-found: error

      - name: Run frozen submission semantic tests
        shell: pwsh
        run: Rscript submission/tests/test_submission_semantics.R
