name: Debug Scientific Reports document build

on:
  push:
    branches:
      - release/scientific-reports-submission-v1.1
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble builder
        run: |
          cat submission/code/_sr_builder_parts/part_* > submission/code/30_build_scientific_reports_manuscript.py
          echo "98c4c68cede36aa77451c15aef8b536ac93152f2eb376aa744fc6dbe28568f70  submission/code/30_build_scientific_reports_manuscript.py" | sha256sum --check
      - name: Install Python dependencies
        run: python -m pip install -q python-docx openpyxl
      - name: Build main manuscript
        run: python submission/code/30_build_scientific_reports_manuscript.py --mode manuscript
      - name: Build supplementary DOCX
        run: python submission/code/31_build_scientific_reports_supplementary.py
