name: Build Scientific Reports submission package

on:
  push:
    branches:
      - release/scientific-reports-submission-v1.1
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build-package:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Assemble deterministic manuscript builder
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d submission/code/_sr_builder_parts ]]; then
            cat submission/code/_sr_builder_parts/part_* > submission/code/30_build_scientific_reports_manuscript.py
          fi
          test -f submission/code/30_build_scientific_reports_manuscript.py
          echo "98c4c68cede36aa77451c15aef8b536ac93152f2eb376aa744fc6dbe28568f70  submission/code/30_build_scientific_reports_manuscript.py" | sha256sum --check
          python -m py_compile submission/code/28_lock_scientific_reports_baseline.py \
            submission/code/29_build_scientific_reports_support.py \
            submission/code/30_build_scientific_reports_manuscript.py \
            submission/code/31_build_scientific_reports_supplementary.py \
            submission/code/32_build_scientific_reports_cover_letter.py \
            submission/code/33_build_scientific_reports_strobe.py \
            submission/code/34_validate_scientific_reports_package.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install document dependencies
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q python-docx openpyxl
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libreoffice-writer fonts-liberation >/dev/null

      - name: Verify immutable JIC baseline
        shell: bash
        run: |
          python submission/code/28_lock_scientific_reports_baseline.py \
            --repo-root . \
            --manifest submission/public_manifest.tsv \
            --out submission/qa/scientific_reports_baseline_lock.json

      - name: Build main manuscript
        shell: bash
        run: python submission/code/30_build_scientific_reports_manuscript.py --mode manuscript

      - name: Build Supplementary Information DOCX
        shell: bash
        run: python submission/code/31_build_scientific_reports_supplementary.py

      - name: Render Supplementary Information PDF
        shell: bash
        run: |
          set -euo pipefail
          out='submission/manuscript_files/scientific_reports'
          profile="file://$RUNNER_TEMP/libreoffice-profile"
          soffice -env:UserInstallation="$profile" --headless --convert-to pdf \
            --outdir "$RUNNER_TEMP" "$out/Scientific_Reports_Supplementary_Information.docx"
          mv "$RUNNER_TEMP/Scientific_Reports_Supplementary_Information.pdf" \
            "$out/Scientific_Reports_Supplementary_Information.pdf"
          test -s "$out/Scientific_Reports_Supplementary_Information.pdf"

      - name: Build support maps, Tables S1-S9, and STROBE
        shell: bash
        run: |
          python submission/code/29_build_scientific_reports_support.py
          python submission/code/33_build_scientific_reports_strobe.py

      - name: Validate private Cover Letter and public package
        shell: bash
        run: |
          private_cover="$RUNNER_TEMP/Scientific_Reports_Cover_Letter.docx"
          python submission/code/32_build_scientific_reports_cover_letter.py --out "$private_cover"
          python submission/code/34_validate_scientific_reports_package.py \
            --repo-root . \
            --private-cover-letter "$private_cover" \
            --out submission/qa/scientific_reports_package_validation.json
          test ! -e submission/manuscript_files/scientific_reports/Scientific_Reports_Cover_Letter.docx

      - name: Rebuild public manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          repo = Path('.').resolve()
          root = repo / 'submission'
          rows = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(repo).as_posix()
              if path.name == 'public_manifest.tsv':
                  continue
              if any(part in {'__pycache__', '.pytest_cache'} for part in path.parts):
                  continue
              if path.suffix.lower() in {'.pyc', '.pyo'}:
                  continue
              if '/figures/' in rel:
                  role = 'publication_figure'
              elif '/supplementary_files/' in rel:
                  role = 'supplementary_workbook'
              elif '/manuscript_files/' in rel:
                  role = 'submission_manuscript_file'
              elif '/public_source_data/' in rel:
                  role = 'aggregate_source_data'
              elif '/manuscript_support/' in rel:
                  role = 'manuscript_support'
              elif '/code/' in rel:
                  role = 'submission_production_code'
              elif '/tests/' in rel:
                  role = 'submission_test'
              elif '/qa/' in rel:
                  role = 'aggregate_QA'
              elif 'numeric_truth' in rel:
                  role = 'numeric_truth'
              else:
                  role = 'repository_interface'
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              rows.append((rel, path.stat().st_size, role, digest))
          manifest = root / 'public_manifest.tsv'
          with manifest.open('w', encoding='utf-8', newline='') as handle:
              handle.write('path\tbytes\trole\tsha256\n')
              for row in rows:
                  handle.write('\t'.join(map(str, row)) + '\n')
          print(f'{len(rows)} submission assets recorded.')
          PY

      - name: Remove temporary builder parts
        shell: bash
        run: rm -rf submission/code/_sr_builder_parts

      - name: Commit generated package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/code submission/manuscript_files/scientific_reports \
            submission/manuscript_support submission/qa submission/public_manifest.tsv
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Build Scientific Reports submission package [skip generation]'
            git push origin HEAD:release/scientific-reports-submission-v1.1
          fi
